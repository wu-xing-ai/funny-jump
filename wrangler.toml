# 游戏本体部署配置：静态网站 + 云端排行榜 API 一体
# Git 连接的构建命令 npx wrangler deploy 会自动发布：
#   - 根目录全部静态文件（游戏页面）
#   - worker.js 脚本（处理 /scores 排行榜接口）
# 并绑定下方 KV 数据库

name = "funny-jump"
main = "worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "LB"
id = "555450476cb14b10ba45b3e44342ed1b"
