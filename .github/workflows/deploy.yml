# 每次 push 到 main 分支自动部署到 Cloudflare Workers（线上正式环境）
#
# 注意：线上域名跑的是 Worker（worker.js + 静态资产 + KV 排行榜），
# 必须用 wrangler deploy 发布整个 Worker；
# 旧版用 pages deploy 只会更新一个没人访问的 Pages 静态副本，
# 改了 worker.js / 排行榜接口都不会生效——这就是曾经"push 了线上不更新"的原因。
#
# 使用前需在 GitHub 仓库 Settings → Secrets and variables → Actions 添加两个机密：
#   CLOUDFLARE_API_TOKEN   —— 在 https://dash.cloudflare.com/profile/api-tokens 创建，
#                             用「编辑 Cloudflare Workers」模板即可
#   CLOUDFLARE_ACCOUNT_ID  —— 在 Cloudflare 控制台首页右侧/Workers和Pages概览页可见
#
# 注意：如果在 Cloudflare 控制台用了 Workers 的「连接到 Git」（构建命令 npx wrangler deploy），
#       这个工作流可以删掉，二选一即可。

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 也允许在 Actions 页面手动触发

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: 发布游戏 + 排行榜接口到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
