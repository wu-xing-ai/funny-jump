# 每次 push 到 main 分支自动部署到 Cloudflare Pages
#
# 使用前需在 GitHub 仓库 Settings → Secrets and variables → Actions 添加两个机密：
#   CLOUDFLARE_API_TOKEN   —— 在 https://dash.cloudflare.com/profile/api-tokens 创建，
#                             用「编辑 Cloudflare Workers」模板，再额外追加 Pages:Edit 权限
#   CLOUDFLARE_ACCOUNT_ID  —— 在 Cloudflare 控制台首页右侧/Workers和Pages概览页可见
#
# 注意：如果在 Cloudflare 控制台用了「连接到 Git」的方式（README 方式A），
#       这个工作流可以删掉，二选一即可。

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 也允许在 Actions 页面手动触发

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: 确保 Pages 项目存在（已存在则跳过）
        run: npx wrangler pages project create funny-jump --production-branch=main || echo "项目已存在，跳过"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 发布游戏到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=funny-jump --branch=main
